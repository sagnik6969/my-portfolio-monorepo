steps:
# Step 1: Install Node.js dependencies
# This step uses a long-lived cache for node_modules to speed up subsequent builds.

# Step 2: Install Moon CLI
# It's best practice to install Moon in a separate step to keep things clean.
- name: 'gcr.io/cloud-builders/npm'
  id: 'Install Moon'
  args: ['install', '-g', '@moonrepo/cli']

# Step 3: Run moon ci
# This is the main step. It executes 'moon ci' to build, lint, and test affected projects.
# We use the nodejs builder which provides a standard Node.js environment.
- name: 'gcr.io/cloud-builders/node'
  id: 'Run CI'
  entrypoint: 'sh'
  args:
    - '-c'
    - |
      # Use $$PATH to escape the dollar sign
      export PATH=$$PATH:$(npm root -g)
      
      # Now run the moon command
      moon ci
options:
  logging: CLOUD_LOGGING_ONLY

