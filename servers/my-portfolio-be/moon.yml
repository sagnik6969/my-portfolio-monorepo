# apps/backend/project.yml
type: "application"
language: "python"
platform: "python"

tasks:
  dev:
    command: "uvicorn main:app --reload --port 8000"
    local: true

  install-deps:
    command: "uv sync"

  check_linting:
    command: "uv run ruff check --output-format=github ."
  
  check_formatting:
    command: "uv run ruff format --check ."

  check_test_coverage:
    command: uv run -m pytest --cov=. --cov-report=term-missing --cov-fail-under=80 tests/