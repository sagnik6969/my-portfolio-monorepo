# apps/backend/project.yml
type: "application"
language: "python"
platform: "python"

tasks:

  dev:
    command: "uv run uvicorn main:app --reload --port 8000"
    local: true

  check_linting:
    command: "ruff check --output-format=github ."
  
  check_formatting:
    command: "ruff format --check ."

