# apps/backend/project.yml
type: "application"
language: "python"
platform: "python"

tasks:
  dev:
    command: "uvicorn main:app --reload --port 8000"
    local: true

  check_linting:
    command: "python3 -m ruff check --output-format=github ."
  
  check_formatting:
    command: "python3 -m ruff format --check ."