# apps/backend/project.yml
type: "application"
language: "python"
platform: "python"

tasks:

  dev:
    command: "uv run uvicorn main:app --reload --port 8000"
    local: true

  check_linting:
    command: "python -m ruff check --output-format=github ."
  
  check_formatting:
    command: "python -m ruff format --check ."

  deploy:
    command: "sh ../../scripts/build_and_push_docker.sh"
    deps:
      - 'check_linting'
      - 'check_formatting'