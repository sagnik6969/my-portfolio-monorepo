# apps/backend/project.yml
type: "application"
language: "python"
platform: "python"

tasks:
  install_uv:
    command: "pip install uv"

  install_deps:
    command: "uv sync --prerelease=allow"
    deps:
      - 'install_uv'

  dev:
    command: "uv run uvicorn main:app --reload --port 8000"
    local: true

  check_linting:
    command: "uv run --prerelease=allow ruff check --output-format=github ."
    deps: 
      - 'install_deps'
  
  check_formatting:
    command: "uv run --prerelease=allow ruff format --check ."
    deps: 
      - 'install_deps'

  deploy:
    command: "sh ../../scripts/build_and_push_docker.sh"
    deps:
      - 'install_deps'
      - 'check_linting'
      - 'check_formatting'